[project]
name = "maude-lakehouse"
version = "0.1.0"
description = "Lakehouse pipeline for FDA MAUDE medical device adverse event data"
readme = "README.md"
license = "MIT"
license-files = ['LICENSE']
authors = [
    { name = "cjburgoyne", email = "Sirhc16@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=26.0.1",
]

[project.scripts]
maude-lakehouse = "maude_lakehouse.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
extend-exclude = ["*.ipynb"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "prek>=0.5.11",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
