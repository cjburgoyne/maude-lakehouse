name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Fails if uv.lock is out of date with pyproject.toml. Python version comes from .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format (prek hooks)
        run: uv run prek run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest
